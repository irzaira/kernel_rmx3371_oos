name: Build Aurora SUSFS (BakaSU)

on:
  push:
    branches: [ bakasu-susfs ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential flex git \
          libssl-dev libelf-dev lld llvm \
          python3 python-is-python3 \
          zip unzip cpio rsync curl \
          gcc g++ \
          binutils-aarch64-linux-gnu

    - name: Clone Clang 20
      run: |
        git clone --depth=1 https://gitlab.com/provasishh/clang-20.git tc

    - name: Setup BakaSU
      run: |
        # buang sisa integrasi dari setup lokal supaya setup.sh mulai dari kondisi bersih
        rm -f drivers/kernelsu
        sed -i '/kernelsu/d' drivers/Makefile
        sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
        REF=$(cat .github/bakasu.ref 2>/dev/null || true)
        echo "BakaSU ref: ${REF:-latest}"
        curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s -- $REF
        git -C KernelSU log -1 --format='BakaSU commit: %H'
        ls -la drivers/kernelsu | head -2

    - name: Build & Package Kernel
      run: |
        set -eo pipefail
        echo "Cloning AnyKernel..."
        git clone --filter=blob:none --depth=1 https://github.com/yassshhhh15/AnyKernel3.git anykernel

        DT=$(date +"%Y%m%d-%H%M")
        CONFIG=vendor/kona-perf_defconfig

        export ARCH=arm64
        export OUT_DIR=$(pwd)/out
        export CROSS_COMPILE=$(pwd)/tc/aarch64-linux-android-4.9/bin/aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-

        export PATH="$(pwd)/tc/clang/bin:$PATH"

        export CC=clang
        export HOSTCC=clang
        export HOSTCXX=clang++

        MAKE_ARGS="O=${OUT_DIR} ARCH=${ARCH} LLVM_IAS=1 CROSS_COMPILE=${CROSS_COMPILE} CC=${CC} HOSTCC=${HOSTCC} HOSTCXX=${HOSTCXX} NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip"

        echo "Configuring kernel..."
        make ${MAKE_ARGS} ${CONFIG}

        echo "== KSU/SUSFS di .config =="
        grep -E "^CONFIG_KSU" out/.config
        test "$(grep -c -E '^CONFIG_KSU(_SUSFS.*)?=y' out/.config)" = 10 || { echo "Opsi KSU/SUSFS tidak lengkap di .config"; exit 1; }

        echo "== BBR/FQ/zstd/schedutil di .config =="
        WANT='^CONFIG_(TCP_CONG_ADVANCED|TCP_CONG_BBR|NET_SCH_FQ|CRYPTO_ZSTD|CPU_FREQ_DEFAULT_GOV_SCHEDUTIL)=y'
        grep -E "$WANT" out/.config
        test "$(grep -c -E "$WANT" out/.config)" = 5 || { echo "Ada opsi yang dibuang diam-diam oleh Kconfig (cek dependensi)"; exit 1; }

        echo "== NetHunter di .config =="
        NH='^CONFIG_(MAC80211|CFG80211_WEXT|ATH9K_HTC|RT2800USB_RT53XX|MT76x2U|NF_TABLES|NFT_COMPAT|SYSVIPC|USB_CONFIGFS_F_HID|USB_CONFIGFS_RNDIS)=y'
        grep -E "$NH" out/.config
        test "$(grep -c -E "$NH" out/.config)" = 10 || { echo "Ada opsi NetHunter yang dibuang diam-diam oleh Kconfig"; exit 1; }

        echo "Compiling kernel..."
        make ${MAKE_ARGS} -j$(nproc) 2>&1 | tee build.log

        echo "Packaging kernel..."
        cp out/arch/arm64/boot/Image anykernel/
        cp out/arch/arm64/boot/dtbo.img anykernel/
        cp out/arch/arm64/boot/dtb anykernel/

        cd anykernel
        zip -r9 Aurora-OOS16-NH-${DT}.zip *

    - name: Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: Aurora-OOS16-NH
        path: anykernel/*.zip

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: |
          build.log
          out/.config
        if-no-files-found: ignore
